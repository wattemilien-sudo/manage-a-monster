<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomechanical Logistics: Physical Trauma & Repair</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        canvas {
            background-color: #1a1c29;
            border: 2px solid #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.3);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            background: #232635;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: 0.2s;
        }
        button:hover { background: #444; }
        .instructions {
            color: #ff3366;
            max-width: 700px;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .stats-panel {
            display: flex;
            gap: 20px;
            background: #151722;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #333;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<button onclick="window.location.href='index.html'" style="background: #232635; border: 1px solid #00f0ff; color: #00f0ff; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-family: monospace; font-weight: bold; margin-bottom: 15px;">
    Return to Dashboard
</button>
    <h2>Grid Module: Physical Trauma & Emergency Repairs</h2>
    <div class="instructions" id="instruction-text">
        <strong>SYSTEM STANDBY:</strong> Grid offline. Click <strong>Dispatch Repair Golem</strong> to initialize grid activity and engage repair protocols.
    </div>

    <div class="stats-panel" id="stats-panel">
        <div>ATP Reserves: <strong id="atp-display" style="color:#ffcc00; font-size: 1.2em;">100</strong></div>
        <div>Active Leaks: <strong id="leaks-display" style="color:#ff3366;">0</strong></div>
        <div>Available Golems: <strong id="golems-display" style="color:#00f0ff;">3</strong></div>
    </div>

    <div class="controls" id="controls-panel">
        <button onclick="dispatchWorker()">Dispatch Repair Golem</button>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const TILE_SIZE = 40;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        // Grid Initialization
        let grid = Array.from({ length: ROWS }, () => Array(COLS).fill({ type: 'empty' }));

        // Vein Highway across Row 5
        const veinRow = 5;
        for (let c = 2; c < COLS - 2; c++) {
            grid[veinRow][c] = { type: 'vein', damaged: false };
        }

        // Game State
        let gameStarted = false;
        let atp = 100;
        let availableGolems = 3;
        let activeWorkers = [];
        let leakParticles = [];

        // Minigame State ('grid' or 'pong')
        let currentMode = 'grid';
        let pongAttempts = 3;
        let pongState = 'ready'; // 'ready', 'playing', 'won', 'lost'

        // Paddle & Ball objects for Pong Repair Minigame
        let paddle = {
            x: 260,
            y: 50, // One row down from the top (Row 1: 40px to 80px)
            width: 80,
            height: 12,
            dx: 6
        };

        let ball = {
            x: 300,
            y: 80,
            radius: 8,
            vx: 3,
            vy: 4
        };

        let goal = {
            x: 288, // Centered at 300 with width 24 (60% bigger than 15)
            y: 390,
            width: 24,
            height: 10
        };

        let keys = {};

        function updateDisplays() {
            if (currentMode !== 'grid' || !gameStarted) return;
            let damagedCount = 0;
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    if(grid[r][c].damaged) damagedCount++;
                }
            }
            document.getElementById('atp-display').innerText = Math.floor(atp);
            document.getElementById('leaks-display').innerText = damagedCount;
            document.getElementById('golems-display').innerText = availableGolems;
        }

        function triggerTrauma() {
            if (currentMode !== 'grid') return;
            let targetCol = Math.floor(Math.random() * (COLS - 6)) + 3;
            for (let c = targetCol; c < targetCol + 3; c++) {
                if (grid[veinRow][c].type === 'vein') {
                    grid[veinRow][c].damaged = true;
                }
            }
            updateDisplays();
        }

        function dispatchWorker() {
            if (!gameStarted) {
                gameStarted = true;
                triggerTrauma();
                document.getElementById('instruction-text').innerHTML = `
                    <strong>TRAUMA ALERT:</strong> External blunt force has fractured the ribcage!<br>
                    Veins are ruptured and bleeding resources. Dispatch <strong>Worker-Golems</strong> to cauterize and repair the damaged grid coordinates.
                `;
            }

            if (availableGolems > 0) {
                availableGolems--;
                startPongMinigame();
            }
            updateDisplays();
        }

        function startPongMinigame() {
            currentMode = 'pong';
            pongAttempts = 3;
            resetPongBall();
            pongState = 'ready';

            document.getElementById('instruction-text').innerHTML = `
                <strong>REPAIR PROTOCOL ACTIVE:</strong> Use <strong>LEFT / RIGHT ARROWS</strong> to control the repair paddle. Hit the ball down into the bottom goal/hole to seal the trauma! Avoid letting the ball hit the top wall behind your paddle. <span id="pong-att" style="color:#ffcc00;">Attempts left: 3</span>
            `;
            document.getElementById('stats-panel').innerHTML = `
                <div>Minigame Mode: <strong style="color:#00f0ff; font-size: 1.2em;">REPAIR PONG</strong></div>
                <div>Attempts Left: <strong id="sk-att" style="color:#ffcc00; font-size: 1.2em;">3</strong></div>
            `;
            document.getElementById('controls-panel').style.display = 'none';
        }

        function resetPongBall() {
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y + paddle.height + 15;
            ball.vx = (Math.random() - 0.5) * 5;
            ball.vy = 4;
        }

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (currentMode === 'pong') {
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (pongState === 'ready') {
                        pongState = 'playing';
                    } else if (pongState === 'won' || pongState === 'lost') {
                        resetToOffline();
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function resetToOffline() {
            gameStarted = false;
            currentMode = 'grid';
            atp = 100;
            availableGolems = 3;
            activeWorkers = [];
            leakParticles = [];

            // Reset grid damage status
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    if(grid[r][c].type === 'vein') {
                        grid[r][c].damaged = false;
                    }
                }
            }

            document.getElementById('controls-panel').style.display = 'flex';
            document.getElementById('instruction-text').innerHTML = `
                <strong>SYSTEM STANDBY:</strong> Grid offline. Click <strong>Dispatch Repair Golem</strong> to initialize grid activity and engage repair protocols.
            `;
            document.getElementById('stats-panel').innerHTML = `
                <div>ATP Reserves: <strong id="atp-display" style="color:#ffcc00; font-size: 1.2em;">100</strong></div>
                <div>Active Leaks: <strong id="leaks-display" style="color:#ff3366;">0</strong></div>
                <div>Available Golems: <strong id="golems-display" style="color:#00f0ff;">3</strong></div>
            `;
        }

        // --- CORE GAME LOOP (60 FPS) ---
        function update() {
            if (!gameStarted) return;

            if (currentMode === 'grid') {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (grid[r][c].damaged) {
                            atp = Math.max(0, atp - 0.03);

                            if (Math.random() < 0.3) {
                                leakParticles.push({
                                    x: c * TILE_SIZE + TILE_SIZE/2 + (Math.random() - 0.5) * 20,
                                    y: r * TILE_SIZE + TILE_SIZE/2 + (Math.random() - 0.5) * 20,
                                    vy: 0.5 + Math.random(),
                                    alpha: 1.0
                                });
                            }
                        }
                    }
                }

                for (let i = leakParticles.length - 1; i >= 0; i--) {
                    let p = leakParticles[i];
                    p.y += p.vy;
                    p.alpha -= 0.02;
                    if (p.alpha <= 0) leakParticles.splice(i, 1);
                }

                for (let i = activeWorkers.length - 1; i >= 0; i--) {
                    let w = activeWorkers[i];
                    let targetX = w.targetC * TILE_SIZE + TILE_SIZE/2;
                    let targetY = w.targetR * TILE_SIZE + TILE_SIZE/2;

                    let dx = targetX - w.x;
                    let dy = targetY - w.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < 3) {
                        grid[w.targetR][w.targetC].damaged = false;
                        availableGolems++;
                        activeWorkers.splice(i, 1);
                    } else {
                        w.x += (dx / dist) * 2.5;
                        w.y += (dy / dist) * 2.5;
                    }
                }
                updateDisplays();
            } else if (currentMode === 'pong') {
                // Handle Paddle movement
                if (keys['ArrowLeft']) {
                    paddle.x = Math.max(10, paddle.x - paddle.dx);
                }
                if (keys['ArrowRight']) {
                    paddle.x = Math.min(canvas.width - paddle.width - 10, paddle.x + paddle.dx);
                }

                if (pongState === 'ready') {
                    ball.x = paddle.x + paddle.width / 2;
                } else if (pongState === 'playing') {
                    ball.x += ball.vx;
                    ball.y += ball.vy;

                    // Wall bounces (Left / Right)
                    if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= canvas.width) {
                        ball.vx = -ball.vx;
                    }

                    // Check top wall (Behind paddle) -> Game Over / Lose Attempt
                    if (ball.y - ball.radius <= 0) {
                        pongAttempts--;
                        document.getElementById('sk-att').innerText = pongAttempts;
                        if (pongAttempts <= 0) {
                            pongState = 'lost';
                        } else {
                            resetPongBall();
                            pongState = 'ready';
                        }
                    }

                    // Paddle collision (Top paddle)
                    if (
                        ball.y + ball.radius >= paddle.y &&
                        ball.y - ball.radius <= paddle.y + paddle.height &&
                        ball.x >= paddle.x &&
                        ball.x <= paddle.x + paddle.width
                    ) {
                        ball.vy = Math.abs(ball.vy); // Bounce downwards
                        let hitOffset = ball.x - (paddle.x + paddle.width / 2);
                        ball.vx = hitOffset * 0.15;
                    }

                    // Bottom collision (Goal or Wall)
                    if (ball.y + ball.radius >= canvas.height) {
                        // Check if it hit the goal/hole in the bottom middle
                        if (ball.x >= goal.x && ball.x <= goal.x + goal.width) {
                            pongState = 'won';
                        } else {
                            // Bottom wall behind/around goal bounces ball back up to player
                            ball.vy = -Math.abs(ball.vy);
                        }
                    }
                }
            }
        }

        // --- RENDERING ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameStarted) {
                ctx.fillStyle = '#141622';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3366';
                ctx.font = '14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('[ SYSTEM OFFLINE ]', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#777';
                ctx.font = '12px monospace';
                ctx.fillText('Press "Dispatch Repair Golem" to initialize grid.', canvas.width / 2, canvas.height / 2 + 15);
                return;
            }

            if (currentMode === 'grid') {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const tile = grid[r][c];
                        const x = c * TILE_SIZE;
                        const y = r * TILE_SIZE;

                        ctx.strokeStyle = '#222';
                        ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                        if (tile.type === 'vein') {
                            if (tile.damaged) {
                                ctx.fillStyle = '#4a0d18';
                                ctx.fillRect(x, y + 5, TILE_SIZE, TILE_SIZE - 10);
                                ctx.strokeStyle = '#ff3366';
                                ctx.lineWidth = 2;
                                ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                                ctx.lineWidth = 1;
                            } else {
                                ctx.fillStyle = '#611724';
                                ctx.fillRect(x, y + 8, TILE_SIZE, TILE_SIZE - 16);
                            }
                        }
                    }
                }

                for (let p of leakParticles) {
                    ctx.fillStyle = 'rgba(255, 51, 102,' + p.alpha + ')';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (let w of activeWorkers) {
                    ctx.fillStyle = '#00f0ff';
                    ctx.beginPath();
                    ctx.arc(w.x, w.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }
            } else if (currentMode === 'pong') {
                // Background arena styling
                ctx.fillStyle = '#141622';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Top Warning Line (Behind paddle wall)
                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 2);
                ctx.lineTo(canvas.width, 2);
                ctx.stroke();

                // Draw Goal/Hole at the bottom middle (Golem portal style - width 24)
                ctx.fillStyle = '#39ff14';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#39ff14';
                ctx.beginPath();
                ctx.ellipse(goal.x + goal.width / 2, goal.y, goal.width / 2, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Draw Pong Paddle (One row down from top)
                ctx.fillStyle = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
                ctx.shadowBlur = 0;

                // Draw Ball
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();

                if (pongState === 'ready') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = '14px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('Press [SPACEBAR] to Serve Repair Ball', canvas.width / 2, canvas.height / 2);
                }

                if (pongState === 'won') {
                    drawOverlay('TRAUMA REPAIRED!', '#39ff14', 'Press [SPACEBAR] to shut down system');
                } else if (pongState === 'lost') {
                    drawOverlay('SYSTEM FAILURE: RUPTURE UNCONTAINED', '#ff3366', 'Press [SPACEBAR] to shut down system');
                }
            }
        }

        function drawOverlay(mainText, color, subText) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = color;
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(mainText, canvas.width / 2, canvas.height / 2 - 15);
            ctx.fillStyle = '#fff';
            ctx.font = '14px monospace';
            ctx.fillText(subText, canvas.width / 2, canvas.height / 2 + 25);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
