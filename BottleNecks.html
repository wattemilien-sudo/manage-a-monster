<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pressure & Bottleneck Sandbox</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        canvas {
            background-color: #1a1c29;
            border: 2px solid #333;
            cursor: crosshair;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            background: #1a1c29;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        button {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
        }
        button.active-capillary { background: #aa4455; border-color: #ff99aa; }
        button.active-artery { background: #ff3366; border-color: #ff99aa; font-weight: bold; }
        .instructions {
            color: #ffcc00;
            max-width: 600px;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .warning { color: #ff3366; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Grid Module: Fluid Dynamics & Ruptures</h2>
    <div class="instructions">
        <strong>THE BOTTLENECK TEST:</strong> The Spawner (White) pumps blood at high speed.<br>
        1. Paint an <strong>Artery</strong> (Thick) leading away from it.<br>
        2. Then, bottleneck it by painting a <strong>Capillary</strong> (Thin) at the end.<br>
        <span class="warning">Watch the pressure build until the Capillary bursts!</span>
    </div>

    <div class="controls" id="build-controls">
        <button id="btn-capillary" class="active-capillary" onclick="setBuildMode('capillary')">Build Capillary (Slow, Cap: 1)</button>
        <button id="btn-artery" onclick="setBuildMode('artery')">Build Artery (Fast, Cap: 3)</button>
        <button onclick="clearGrid()" style="margin-left: 20px; background: #555;">Clear Grid</button>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="200"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 40;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        // Initialize the Grid safely (avoiding reference duplication)
        let grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = { type: 'empty' };
            }
        }

        // Fixed Spawner that pumps right
        const spawner = { r: 2, c: 1 };
        grid[spawner.r][spawner.c] = { type: 'spawner' };

        let bloodCells = [];
        let currentBuildMode = 'capillary'; // 'capillary' or 'artery'
        let isDrawing = false;
        let tickCount = 0;

        // UI Logic
        function setBuildMode(mode) {
            currentBuildMode = mode;
            document.getElementById('btn-capillary').className = mode === 'capillary' ? 'active-capillary' : '';
            document.getElementById('btn-artery').className = mode === 'artery' ? 'active-artery' : '';
        }

        function clearGrid() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].type !== 'spawner') grid[r][c] = { type: 'empty' };
                }
            }
            bloodCells = [];
        }

        // Mouse Painting
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; paintVein(e); });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) paintVein(e); });
        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        function paintVein(e) {
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const r = Math.floor((e.clientY - rect.top) / TILE_SIZE);

            // Paint over anything except the spawner. Automatically sets direction to RIGHT for this test.
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c].type !== 'spawner') {
                grid[r][c] = { type: currentBuildMode, dir: 'RIGHT' };
            }
        }

        // --- CORE GRID LOGIC (This is what goes in your grid.js file) ---
        
        setInterval(() => {
            tickCount++;

            // 1. HIGH PRESSURE SPAWNER: Pumps a cell every single tick
            bloodCells.push({ r: spawner.r, c: spawner.c });

            // 2. MOVEMENT PHASE
            for (let i = bloodCells.length - 1; i >= 0; i--) {
                let cell = bloodCells[i];
                let currentTile = grid[cell.r][cell.c];

                // If on a ruptured tile or empty tissue, the cell dies and is deleted
                if (currentTile.type === 'empty' || currentTile.type === 'ruptured') {
                    bloodCells.splice(i, 1);
                    continue;
                }

                // Check speed logic:
                // Arteries move cells every tick. Capillaries move cells only on EVEN ticks.
                if (currentTile.type === 'capillary' && tickCount % 2 !== 0) {
                    continue; // Skip moving this cell this tick (it is slow)
                }

                // Determine next tile (Forced Right for this sandbox)
                let nextC = cell.c + 1;

                if (nextC >= COLS) {
                    bloodCells.splice(i, 1); // Delete if it goes off screen
                    continue;
                }

                // Move the cell
                cell.c = nextC;
            }

            // 3. PRESSURE & RUPTURE CHECK PHASE
            // Count how many cells are on each tile right now
            let tileOccupancy = {};
            for (let cell of bloodCells) {
                let key = `${cell.r},${cell.c}`;
                tileOccupancy[key] = (tileOccupancy[key] || 0) + 1;
            }

            // Check if any tile has exceeded its capacity
            for (let key in tileOccupancy) {
                let [r, c] = key.split(',').map(Number);
                let tile = grid[r][c];
                let count = tileOccupancy[key];

                // Capillary bursts if > 1 cell. Artery bursts if > 3 cells.
                if (tile.type === 'capillary' && count > 1) {
                    grid[r][c] = { type: 'ruptured' };
                } else if (tile.type === 'artery' && count > 3) {
                    grid[r][c] = { type: 'ruptured' };
                }
            }

            draw();
        }, 200); // 200ms per tick


        // --- RENDERING PHASE ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tile = grid[r][c];
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;

                    ctx.strokeStyle = '#222';
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                    if (tile.type === 'spawner') {
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
                        ctx.fillStyle = 'black'; ctx.fillText('PUMP', x+6, y+25);
                    } 
                    else if (tile.type === 'artery') {
                        // Thick pulsing tube
                        ctx.fillStyle = '#611724'; 
                        ctx.fillRect(x, y + 2, TILE_SIZE, TILE_SIZE - 4);
                    }
                    else if (tile.type === 'capillary') {
                        // Thin, fragile tube
                        ctx.fillStyle = '#aa4455'; 
                        ctx.fillRect(x, y + 15, TILE_SIZE, 10);
                    }
                    else if (tile.type === 'ruptured') {
                        // Messy spill visual
                        ctx.fillStyle = '#ff9900'; 
                        ctx.beginPath();
                        ctx.arc(x + 20, y + 20, 15, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ff3366';
                        ctx.beginPath();
                        ctx.arc(x + 15, y + 25, 10, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'black'; 
                        ctx.fillText('BURST', x+5, y+25);
                    }
                }
            }

            // Draw blood cells
            for (let cell of bloodCells) {
                ctx.fillStyle = '#00f0ff'; // Bright blue for visibility
                ctx.beginPath();
                // Add a little randomness so stacked cells look like a cluster building pressure
                let offsetX = (Math.random() - 0.5) * 8;
                let offsetY = (Math.random() - 0.5) * 8;
                ctx.arc(
                    cell.c * TILE_SIZE + TILE_SIZE / 2 + offsetX, 
                    cell.r * TILE_SIZE + TILE_SIZE / 2 + offsetY, 
                    4, 0, Math.PI * 2
                );
                ctx.fill();
            }
        }
    </script>
</body>
</html>
