<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vein Routing Sandbox</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        canvas {
            background-color: #1a1c29;
            border: 2px solid #333;
            cursor: crosshair;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
        }
        button.active {
            background: #ff3366;
            border-color: #ff99aa;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Vein Routing Sandbox</h2>
    <p style="color: #aaa;">Select a direction, then click and drag on the grid to build veins.<br>The white square is a permanent spawner pumping out blood cells.</p>

    <!-- Controls for selecting conveyor direction -->
    <div class="controls" id="direction-controls">
        <button id="dir-up" onclick="setDirection('UP')">Paint UP</button>
        <button id="dir-right" class="active" onclick="setDirection('RIGHT')">Paint RIGHT</button>
        <button id="dir-down" onclick="setDirection('DOWN')">Paint DOWN</button>
        <button id="dir-left" onclick="setDirection('LEFT')">Paint LEFT</button>
        <button onclick="clearGrid()" style="margin-left: 20px; background: #555;">Clear All</button>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 40;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        // The Grid: Every tile holds an object with a type and a direction
        let grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = { type: 'empty', dir: null };
            }
        }

        // A permanent spawner just for testing the flow
        const spawner = { r: 4, c: 2 };
        grid[spawner.r][spawner.c] = { type: 'spawner', dir: 'RIGHT' };

        let bloodCells = [];
        let currentBuildDirection = 'RIGHT';
        let isDrawing = false;

        // UI Logic
        function setDirection(dir) {
            currentBuildDirection = dir;
            document.querySelectorAll('#direction-controls button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`dir-${dir.toLowerCase()}`).classList.add('active');
        }

        function clearGrid() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].type === 'vein') {
                        grid[r][c] = { type: 'empty', dir: null };
                    }
                }
            }
            bloodCells = [];
        }

        // Mouse Painting Logic
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; paintVein(e); });
        canvas.addEventListener('mousemove', (e) => { if (isDrawing) paintVein(e); });
        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        function paintVein(e) {
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const r = Math.floor((e.clientY - rect.top) / TILE_SIZE);

            // Only paint if it's within bounds and isn't the spawner
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c].type !== 'spawner') {
                grid[r][c] = { type: 'vein', dir: currentBuildDirection };
            }
        }

        // --- CORE GAME LOOP ---
        
        setInterval(() => {
            // 1. Spawner generates a new blood cell every tick
            bloodCells.push({ r: spawner.r, c: spawner.c });

            // 2. Move all existing blood cells based on the vein they are standing on
            for (let i = bloodCells.length - 1; i >= 0; i--) {
                let cell = bloodCells[i];
                let currentTile = grid[cell.r][cell.c];

                // If the cell is not on a vein or spawner, it dies (spills)
                if (currentTile.type === 'empty') {
                    bloodCells.splice(i, 1);
                    continue;
                }

                // Determine the next tile based on the current tile's direction
                let nextR = cell.r;
                let nextC = cell.c;

                if (currentTile.dir === 'UP') nextR -= 1;
                if (currentTile.dir === 'DOWN') nextR += 1;
                if (currentTile.dir === 'LEFT') nextC -= 1;
                if (currentTile.dir === 'RIGHT') nextC += 1;

                // Check if the next tile is out of bounds
                if (nextR < 0 || nextR >= ROWS || nextC < 0 || nextC >= COLS) {
                    bloodCells.splice(i, 1);
                    continue;
                }

                // Move the cell to the new location
                cell.r = nextR;
                cell.c = nextC;
            }

            draw();
        }, 250); // Speed of the conveyor belt (250ms per tick)


        // --- RENDERING ---

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw the grid tiles
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tile = grid[r][c];
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;

                    // Draw faint grid lines
                    ctx.strokeStyle = '#222';
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                    if (tile.type === 'spawner') {
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
                    } 
                    else if (tile.type === 'vein') {
                        // Draw the fleshy vein
                        ctx.fillStyle = '#611724'; 
                        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);

                        // Draw the directional arrow to help the player see the flow
                        ctx.fillStyle = 'rgba(255, 51, 102, 0.5)';
                        ctx.beginPath();
                        if (tile.dir === 'UP') {
                            ctx.moveTo(x + TILE_SIZE/2, y + 5);
                            ctx.lineTo(x + TILE_SIZE - 10, y + TILE_SIZE - 10);
                            ctx.lineTo(x + 10, y + TILE_SIZE - 10);
                        } else if (tile.dir === 'DOWN') {
                            ctx.moveTo(x + TILE_SIZE/2, y + TILE_SIZE - 5);
                            ctx.lineTo(x + TILE_SIZE - 10, y + 10);
                            ctx.lineTo(x + 10, y + 10);
                        } else if (tile.dir === 'LEFT') {
                            ctx.moveTo(x + 5, y + TILE_SIZE/2);
                            ctx.lineTo(x + TILE_SIZE - 10, y + 10);
                            ctx.lineTo(x + TILE_SIZE - 10, y + TILE_SIZE - 10);
                        } else if (tile.dir === 'RIGHT') {
                            ctx.moveTo(x + TILE_SIZE - 5, y + TILE_SIZE/2);
                            ctx.lineTo(x + 10, y + 10);
                            ctx.lineTo(x + 10, y + TILE_SIZE - 10);
                        }
                        ctx.fill();
                    }
                }
            }

            // Draw the moving blood cells
            for (let cell of bloodCells) {
                ctx.fillStyle = '#ff3366'; // Bright neon red
                ctx.beginPath();
                ctx.arc(
                    cell.c * TILE_SIZE + TILE_SIZE / 2, 
                    cell.r * TILE_SIZE + TILE_SIZE / 2, 
                    6, 0, Math.PI * 2
                );
                ctx.fill();
            }
        }
    </script>
</body>
</html>
