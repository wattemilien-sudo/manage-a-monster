<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomechanical Logistics: Happy Thoughts Module</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        canvas {
            background-color: #1a1c29;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            background: #232635;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 40px;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #444; border-color: #39ff14; color: #39ff14; }
        .instructions {
            color: #ffcc00;
            max-width: 650px;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h2>Grid Module: Positive Reinforcement</h2>
    <div class="instructions" id="instruction-text">
        <strong>SYSTEM IDLE:</strong> Awaiting command to initiate positivity protocol.
    </div>

    <div class="controls" id="controls-panel">
        <button id="btn-happy" onclick="initiateCountdown()">Construct happy thoughts</button>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game States: 'idle', 'countdown', 'playing', 'win', 'lose', 'gameOver'
        let gameState = 'idle'; 
        let attempts = 3;
        
        // Timers
        let countdownTime = 3;
        let gameTime = 30.0;
        let lastTime = 0;

        // Typing variables
        let currentInput = "";
        let matchedWords = [];
        const targetWordCount = 6; 

        // Massive dictionary of happy/positive words
        const happyDictionary = [
            "happy", "joy", "love", "smile", "laugh", "peace", "fun", "glad", 
            "bliss", "cheer", "hope", "kind", "sweet", "good", "great", "awesome", 
            "proud", "brave", "calm", "safe", "warm", "bright", "sunny", "delight", 
            "magic", "dream", "charm", "luck", "grace", "hero", "play", "chill", 
            "cozy", "super", "grand", "pure", "free", "yay", "wow", "amaze", 
            "beauty", "glow", "hug", "kiss", "care", "rest", "heal", "win", "best",
            "fantastic", "wonderful", "amazing", "excellent", "fabulous", "glorious", 
            "splendid", "superb", "brilliant", "stellar", "terrific", "perfect", 
            "epic", "cool", "rad", "neat", "swell", "merry", "jovial", "jolly", 
            "upbeat", "lively", "perky", "cheerful", "radiant", "vibrant", "zesty", 
            "serene", "tranquil", "placid", "mellow", "relaxed", "content", "satisfied", 
            "fulfilled", "thrive", "flourish", "soar", "achieve", "succeed", "victory", 
            "triumph", "glory", "honor", "noble", "bold", "daring", "fearless", 
            "strong", "mighty", "clever", "smart", "wise", "genius", "loyal", 
            "honest", "true", "fair", "just", "gentle", "tender", "soft", "mild", 
            "friend", "buddy", "pal", "mate", "family", "home", "heart", "soul", 
            "spirit", "angel", "star", "sun", "light", "spark", "shine", "gleam", 
            "glitter", "dazzle", "bloom", "blossom", "grow", "laughing", "smiling", 
            "giggle", "chuckle", "grin", "dance", "sing", "celebrate", "party", 
            "festive", "hooray", "bravo", "woohoo", "bingo", "jackpot", "gold", 
            "wealth", "rich", "abundant", "plenty", "bounty", "gift", "present", 
            "prize", "reward", "bonus", "treat", "feast", "snack", "yummy", "tasty", 
            "delicious", "sweetheart", "darling", "honey", "sugar", "babe", "cutie", 
            "pretty", "gorgeous", "stunning", "handsome", "cute", "adorable", "lovely", 
            "divine", "heaven", "paradise", "utopia", "oasis", "haven", "sanctuary", 
            "shelter", "comfort", "ease", "snug", "warmth", "snuggle", "cuddle", 
            "embrace", "support", "help", "guide", "lead", "inspire", "motivate", 
            "encourage", "uplift", "elevate", "boost", "alive", "awake", "fresh", 
            "crisp", "clean", "clear", "holy", "sacred", "bless", "blessed", 
            "thank", "grateful", "appreciate", "value", "treasure", "cherish", 
            "adore", "worship", "praise", "laud", "exalt", "cheers"
        ];

        // Particle effect for correct words
        let particles = [];

        function resetToIdle() {
            gameState = 'idle';
            attempts = 3;
            document.getElementById('instruction-text').innerHTML = `
                <strong>SYSTEM IDLE:</strong> Awaiting command to initiate positivity protocol.
            `;
            document.getElementById('controls-panel').innerHTML = `
                <button id="btn-happy" onclick="initiateCountdown()">Construct happy thoughts</button>
            `;
        }

        function initiateCountdown() {
            gameState = 'countdown';
            countdownTime = 3;
            lastTime = performance.now();
            updateUI();
        }

        function startGame() {
            gameState = 'playing';
            gameTime = 30.0;
            currentInput = "";
            matchedWords = [];
            particles = [];
            lastTime = performance.now();
            updateUI();
        }

        function spawnParticles(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1.0
                });
            }
        }

        function updateUI() {
            if (gameState === 'countdown' || gameState === 'playing') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong>PROTOCOL ACTIVE:</strong> Type positive words and press <strong>ENTER</strong> or <strong>SPACE</strong>! Minor typos are accepted.
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div>Attempts Remaining: <strong style="color:#00f0ff;">${attempts}</strong></div>
                    <div>Words Constructed: <strong style="color:#39ff14;">${matchedWords.length}/${targetWordCount}</strong></div>
                    <div>Time Left: <strong style="color:#ffcc00;">${Math.ceil(gameTime)}s</strong></div>
                `;
            } else if (gameState === 'win') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong style="color:#39ff14;">PROTOCOL SUCCESSFUL:</strong> Positive network established. Press <strong>SPACEBAR</strong> to return to menu.
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div style="color:#39ff14; font-weight:bold;">MINDSET ELEVATED</div>
                `;
            } else if (gameState === 'lose') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong style="color:#ffcc00;">PROTOCOL FAILED:</strong> Insufficient positive thoughts generated. Press <strong>SPACEBAR</strong> to try again.
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div style="color:#ffcc00; font-weight:bold;">ATTEMPT FAILED (${attempts} left)</div>
                `;
            } else if (gameState === 'gameOver') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong style="color:#ff3366;">CRITICAL FAILURE:</strong> Protocol attempts exhausted. Press <strong>SPACEBAR</strong> to restart system.
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div style="color:#ff3366; font-weight:bold;">SYSTEM OVERLOAD</div>
                `;
            }
        }

        // Levenshtein distance function for fuzzy matching (allowing 1 or 2 typos)
        function getLevenshteinDistance(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) {
                matrix[i] = [i];
            }
            for (let j = 0; j <= a.length; j++) {
                matrix[0][j] = j;
            }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, // substitution
                            Math.min(
                                matrix[i][j - 1] + 1, // insertion
                                matrix[i - 1][j] + 1  // deletion
                            )
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        // Event Listeners for Typing
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameState === 'idle') return; 
                
                if (gameState === 'win' || gameState === 'gameOver') {
                    e.preventDefault();
                    resetToIdle();
                    return;
                } else if (gameState === 'lose') {
                    e.preventDefault();
                    initiateCountdown();
                    return;
                }
            }

            if (gameState === 'playing') {
                if (e.code === 'Space') e.preventDefault();

                if (e.key.length === 1 && e.key.match(/[a-z]/i)) {
                    if (currentInput.length < 15) {
                        currentInput += e.key.toLowerCase();
                    }
                } 
                else if (e.key === 'Backspace') {
                    currentInput = currentInput.slice(0, -1);
                }
                else if (e.key === 'Enter' || e.code === 'Space') {
                    if (currentInput.length > 0) {
                        checkWord(currentInput);
                        currentInput = "";
                    }
                }
            }
        });

        function checkWord(typedWord) {
            let bestMatch = null;
            let lowestDistance = Infinity;

            // Find the closest matching word in the dictionary
            for (let i = 0; i < happyDictionary.length; i++) {
                let dist = getLevenshteinDistance(typedWord, happyDictionary[i]);
                if (dist < lowestDistance) {
                    lowestDistance = dist;
                    bestMatch = happyDictionary[i];
                }
            }

            // Accept the word if the distance is 2 or less (allowing 1-2 incorrect/missing letters)
            if (lowestDistance <= 2 && bestMatch && !matchedWords.includes(bestMatch)) {
                matchedWords.push(bestMatch);
                spawnParticles(canvas.width / 2, canvas.height / 2 + 30);
                updateUI();
                
                if (matchedWords.length >= targetWordCount) {
                    gameState = 'win';
                    updateUI();
                }
            }
        }

        // Logic Update
        function update(currentTime) {
            let deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (gameState === 'countdown') {
                countdownTime -= deltaTime;
                if (countdownTime <= 0) {
                    startGame();
                }
            } 
            else if (gameState === 'playing') {
                gameTime -= deltaTime;
                
                let timeDisplay = document.getElementById('controls-panel');
                if (timeDisplay && Math.ceil(gameTime) >= 0) {
                    timeDisplay.innerHTML = `
                        <div>Attempts Remaining: <strong style="color:#00f0ff;">${attempts}</strong></div>
                        <div>Words Constructed: <strong style="color:#39ff14;">${matchedWords.length}/${targetWordCount}</strong></div>
                        <div>Time Left: <strong style="color:#ffcc00;">${Math.ceil(gameTime)}s</strong></div>
                    `;
                }

                if (gameTime <= 0) {
                    attempts--;
                    if (attempts <= 0) {
                        gameState = 'gameOver';
                    } else {
                        gameState = 'lose';
                    }
                    updateUI();
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= deltaTime * 1.5;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }
        }

        // Rendering
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'idle') {
                ctx.fillStyle = '#39ff14';
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('POSITIVE REINFORCEMENT - STANDBY', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#888';
                ctx.font = '12px monospace';
                ctx.fillText('Click the button above to begin protocol.', canvas.width / 2, canvas.height / 2 + 15);
            } 
            else if (gameState === 'countdown') {
                ctx.fillStyle = '#141622';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#00f0ff';
                ctx.font = 'bold 60px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let displayTime = Math.ceil(countdownTime);
                if (displayTime > 0) {
                    ctx.fillText(displayTime, canvas.width / 2, canvas.height / 2);
                } else {
                    ctx.fillStyle = '#39ff14';
                    ctx.fillText("BEGIN", canvas.width / 2, canvas.height / 2);
                }
                ctx.textBaseline = 'alphabetic';
            }
            else if (gameState === 'playing') {
                // Draw timer bar at top
                ctx.fillStyle = '#222';
                ctx.fillRect(20, 20, canvas.width - 40, 10);
                let timeRatio = Math.max(0, gameTime / 30.0);
                ctx.fillStyle = timeRatio > 0.25 ? '#39ff14' : '#ff3366';
                ctx.fillRect(20, 20, (canvas.width - 40) * timeRatio, 10);

                // Draw word progress boxes
                const boxW = 40, boxH = 40, gap = 15;
                const totalW = (targetWordCount * boxW) + ((targetWordCount - 1) * gap);
                const startX = (canvas.width - totalW) / 2;
                
                for (let i = 0; i < targetWordCount; i++) {
                    let bx = startX + i * (boxW + gap);
                    let by = 60;
                    
                    ctx.strokeStyle = '#444';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bx, by, boxW, boxH);

                    if (i < matchedWords.length) {
                        ctx.fillStyle = '#39ff14';
                        ctx.fillRect(bx + 4, by + 4, boxW - 8, boxH - 8);
                    }
                }

                // Draw Typed Words List Background
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(50, 130, canvas.width - 100, 100);
                
                // Draw successfully typed words
                ctx.fillStyle = '#00f0ff';
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                let wordString = matchedWords.join(" • ");
                if (wordString === "") wordString = "Awaiting input...";
                
                if (ctx.measureText(wordString).width > canvas.width - 120) {
                    let half = Math.floor(matchedWords.length / 2);
                    ctx.fillText(matchedWords.slice(0, half).join(" • "), canvas.width / 2, 170);
                    ctx.fillText(matchedWords.slice(half).join(" • "), canvas.width / 2, 195);
                } else {
                    ctx.fillText(wordString, canvas.width / 2, 185);
                }

                // Draw Input Field
                ctx.fillStyle = '#232635';
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 2;
                ctx.fillRect(150, 270, 300, 50);
                ctx.strokeRect(150, 270, 300, 50);

                // Draw Current Input Text
                ctx.fillStyle = '#fff';
                ctx.font = '24px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let displayText = currentInput + (Math.floor(performance.now() / 500) % 2 === 0 ? "_" : "");
                ctx.fillText(displayText, canvas.width / 2, 295);
                ctx.textBaseline = 'alphabetic';

                // Draw helper text
                ctx.fillStyle = '#888';
                ctx.font = '12px monospace';
                ctx.fillText('Press SPACE or ENTER to submit (minor typos allowed)', canvas.width / 2, 345);

                // Draw particles
                for (let p of particles) {
                    ctx.fillStyle = `rgba(57, 255, 20, ${p.life})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            else if (gameState === 'win') {
                ctx.fillStyle = '#141622';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#39ff14';
                ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('POSITIVITY GOAL REACHED', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '14px monospace';
                ctx.fillText(`You successfully generated ${targetWordCount} happy thoughts!`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#00f0ff';
                ctx.fillText('Press SPACEBAR to return to main menu.', canvas.width / 2, canvas.height / 2 + 45);
            }
            else if (gameState === 'lose') {
                ctx.fillStyle = '#141622';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('TIME EXPIRED', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '14px monospace';
                ctx.fillText(`You constructed ${matchedWords.length}/${targetWordCount} words.`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#00f0ff';
                ctx.fillText(`Attempts Remaining: ${attempts}. Press SPACEBAR to try again.`, canvas.width / 2, canvas.height / 2 + 45);
            }
            else if (gameState === 'gameOver') {
                ctx.fillStyle = '#141622';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3366';
                ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('CRITICAL FAILURE', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#888';
                ctx.font = '14px monospace';
                ctx.fillText('System unable to sustain positive feedback loop.', canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('Press SPACEBAR to restart module.', canvas.width / 2, canvas.height / 2 + 45);
            }
        }

        // Main Loop
        function loop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(loop);
        }
        
        requestAnimationFrame(loop);
    </script>
</body>
</html>
