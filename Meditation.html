<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomechanical Logistics: Meditation Module</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }
        
        /* --- Return Button (Centered, Cyan outline) --- */
        .return-btn {
            background: #141622;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
            font-family: inherit;
            margin-bottom: 25px; /* Spaces it out from the title */
        }

        .return-btn:hover {
            background: #232635;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            color: #00f0ff;
        }

        canvas {
            background-color: #1a1c29;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            background: #232635;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 40px;
        }
        
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
        }
        
        button:hover { background: #444; border-color: #00f0ff; color: #00f0ff; }
        
        .instructions {
            color: #00f0ff;
            max-width: 650px;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Dashboard Return Button -->
    <a href="index.html" class="return-btn">Return to Dashboard</a>

    <h2>Grid Module: Cognitive Meditation</h2>
    
    <div class="instructions" id="instruction-text">
        <strong>SYSTEM IDLE:</strong> Awaiting command to initiate meditation protocol.
    </div>

    <div class="controls" id="controls-panel">
        <button id="btn-start" onclick="startGame()">Start Meditation Protocol</button>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game States: 'idle', 'playing', 'win', 'lose'
        let gameState = 'idle'; 
        
        let goodAbsorbed = 0;
        let badAbsorbed = 0;
        const WIN_TARGET = 10;
        const LOSE_LIMIT = 5;

        let thoughts = [];
        let particles = [];
        
        let spawnTimer = 0;
        let spawnRate = 1200; // ms between spawns
        let lastTime = 0;

        const badWords = ["STRESS", "FEAR", "PANIC", "ANGER", "DOUBT", "GUILT"];
        const goodWords = ["PEACE", "CALM", "JOY", "LOVE", "REST", "HOPE"];

        function resetToIdle() {
            gameState = 'idle';
            document.getElementById('instruction-text').innerHTML = `
                <strong>SYSTEM IDLE:</strong> Awaiting command to initiate meditation protocol.
            `;
            document.getElementById('controls-panel').innerHTML = `
                <button id="btn-start" onclick="startGame()">Start Meditation Protocol</button>
            `;
        }

        function startGame() {
            gameState = 'playing';
            goodAbsorbed = 0;
            badAbsorbed = 0;
            thoughts = [];
            particles = [];
            spawnTimer = 500; // Start first spawn quickly
            spawnRate = 1200;
            lastTime = performance.now();
            updateUI();
        }

        function updateUI() {
            if (gameState === 'playing') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong>PROTOCOL ACTIVE:</strong> Click to destroy <span style="color:#ff3366;">BAD</span> thoughts. Allow <span style="color:#39ff14;">GOOD</span> thoughts to enter the mind!
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div>Good Thoughts Absorbed: <strong style="color:#39ff14;">${goodAbsorbed}/${WIN_TARGET}</strong></div>
                    <div>Bad Thoughts Absorbed: <strong style="color:#ff3366;">${badAbsorbed}/${LOSE_LIMIT}</strong></div>
                    <button onclick="resetToIdle()" style="background: #551111;">Abort Protocol</button>
                `;
            } else if (gameState === 'win') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong style="color:#39ff14;">PROTOCOL SUCCESSFUL:</strong> Cognitive equilibrium achieved. Press <strong>SPACEBAR</strong> to restart or click Return to Dashboard.
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div style="color:#39ff14; font-weight:bold;">MIND CLEARED - MENTAL HEALTH RESTORED</div>
                `;
            } else if (gameState === 'lose') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong style="color:#ff3366;">PROTOCOL FAILED:</strong> Cognitive overload from negative stimuli. Press <strong>SPACEBAR</strong> to retry.
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div style="color:#ff3366; font-weight:bold;">SYSTEM OVERLOAD - MENTAL HEALTH DAMAGED</div>
                `;
            }
        }

        function spawnThought() {
            // 60% chance for a bad thought (needs to be challenging)
            let isBad = Math.random() > 0.4; 
            
            // Random edge: 0=Top, 1=Right, 2=Bottom, 3=Left
            let side = Math.floor(Math.random() * 4);
            let tx, ty;
            
            if (side === 0) { tx = Math.random() * canvas.width; ty = -30; }
            else if (side === 1) { tx = canvas.width + 30; ty = Math.random() * canvas.height; }
            else if (side === 2) { tx = Math.random() * canvas.width; ty = canvas.height + 30; }
            else { tx = -30; ty = Math.random() * canvas.height; }

            let wordList = isBad ? badWords : goodWords;
            let word = wordList[Math.floor(Math.random() * wordList.length)];

            // Calculate trajectory towards the center (300, 200)
            let dx = 300 - tx;
            let dy = 200 - ty;
            let dist = Math.hypot(dx, dy);
            
            // Speed variance
            let speed = isBad ? (0.6 + Math.random() * 0.4) : (0.4 + Math.random() * 0.3);

            thoughts.push({
                x: tx, 
                y: ty,
                vx: (dx / dist) * speed,
                vy: (dy / dist) * speed,
                type: isBad ? 'bad' : 'good',
                text: word,
                radius: 25
            });
        }

        function createDestructionParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1.0,
                    color: color
                });
            }
        }

        // Handle Clicking
        canvas.addEventListener('click', (e) => {
            if (gameState !== 'playing') return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Iterate backwards to safely remove from array
            for (let i = thoughts.length - 1; i >= 0; i--) {
                let t = thoughts[i];
                let dist = Math.hypot(mouseX - t.x, mouseY - t.y);
                
                // Generous click hitbox (radius + 10)
                if (dist <= t.radius + 10) {
                    let color = t.type === 'bad' ? '#ff3366' : '#39ff14';
                    createDestructionParticles(t.x, t.y, color);
                    thoughts.splice(i, 1);
                    break; // Only destroy one thought per click
                }
            }
        });

        // Spacebar listener for restarting
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameState === 'idle') return;
                
                if (gameState === 'win' || gameState === 'lose') {
                    e.preventDefault();
                    resetToIdle();
                }
            }
        });

        // Game Loop Update logic
        function update(currentTime) {
            let deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            // Cap delta time to prevent massive jumps if tab is unfocused
            if (deltaTime > 100) deltaTime = 16; 

            if (gameState === 'playing') {
                spawnTimer -= deltaTime;
                if (spawnTimer <= 0) {
                    spawnThought();
                    // Slowly increase spawn rate as game progresses
                    spawnRate = Math.max(500, 1200 - (goodAbsorbed * 60));
                    spawnTimer = spawnRate;
                }

                for (let i = thoughts.length - 1; i >= 0; i--) {
                    let t = thoughts[i];
                    // Normalize movement to 60 FPS standard (approx 16ms per frame)
                    t.x += t.vx * (deltaTime / 16);
                    t.y += t.vy * (deltaTime / 16);

                    // Check if it reached the meditator's mind (center of canvas)
                    let distToCenter = Math.hypot(300 - t.x, 200 - t.y);
                    if (distToCenter < 40) {
                        if (t.type === 'good') {
                            goodAbsorbed++;
                        } else {
                            badAbsorbed++;
                        }
                        
                        let color = t.type === 'bad' ? '#ff3366' : '#39ff14';
                        createDestructionParticles(t.x, t.y, color);
                        thoughts.splice(i, 1);
                        
                        updateUI();

                        // Check Win/Loss conditions and update Master Dashboard Health
                        if (badAbsorbed >= LOSE_LIMIT) {
                            gameState = 'lose';
                            let currentMental = parseInt(localStorage.getItem('health_mental')) || 100;
                            localStorage.setItem('health_mental', Math.max(0, currentMental - 25)); // Deal 25 mental damage
                            updateUI();
                        } else if (goodAbsorbed >= WIN_TARGET) {
                            gameState = 'win';
                           let currentMental = parseInt(localStorage.getItem('health_mental')) || 30;
localStorage.setItem('health_mental', Math.min(100, currentMental + 25));
                        }
                    }
                }

                // Update particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx * (deltaTime / 16);
                    p.y += p.vy * (deltaTime / 16);
                    p.life -= (deltaTime / 1000) * 1.5;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }
        }

        // Rendering function
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background grid lines
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            if (gameState === 'idle') {
                ctx.fillStyle = '#00f0ff';
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('COGNITIVE MEDITATION - STANDBY', canvas.width / 2, canvas.height / 2 - 40);
                ctx.fillStyle = '#888';
                ctx.font = '12px monospace';
                ctx.fillText('Click start to begin filtering thoughts.', canvas.width / 2, canvas.height / 2 + 50);
            } 
            else if (gameState === 'playing') {
                // Draw thoughts
                for (let t of thoughts) {
                    ctx.fillStyle = '#1a1c29';
                    ctx.strokeStyle = t.type === 'bad' ? '#ff3366' : '#39ff14';
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = t.type === 'bad' ? '#ff3366' : '#39ff14';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(t.text, t.x, t.y);
                }

                // Draw Particles
                for (let p of particles) {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }

            // Always draw the Meditator in center
            if (gameState !== 'idle') {
                drawMeditator(300, 200);
            }

            // Overlay screens for win/lose
            if (gameState === 'win') {
                ctx.fillStyle = 'rgba(20, 22, 34, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#39ff14';
                ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('COGNITIVE EQUILIBRIUM ACHIEVED', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '14px monospace';
                ctx.fillText(`You successfully absorbed 10 positive thoughts.`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#00f0ff';
                ctx.fillText('Mental health restored to 100%. Press SPACEBAR to restart.', canvas.width / 2, canvas.height / 2 + 45);
            }
            else if (gameState === 'lose') {
                ctx.fillStyle = 'rgba(20, 22, 34, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ff3366';
                ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('MIND OVERWHELMED', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '14px monospace';
                ctx.fillText(`5 negative thoughts breached the core.`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('Mental health has been damaged. Press SPACEBAR to try again.', canvas.width / 2, canvas.height / 2 + 45);
            }
        }

        // Helper function to draw the person meditating
        function drawMeditator(x, y) {
            // Aura / Forcefield
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            
            // Make aura pulse slightly based on good thoughts
            let pulse = Math.sin(performance.now() / 300) * 3;
            let auraRadius = 45 + (goodAbsorbed * 2) + pulse;

            ctx.beginPath();
            ctx.arc(x, y, auraRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash

            // Person Head
            ctx.fillStyle = '#e0e6ed';
            ctx.beginPath();
            ctx.arc(x, y - 20, 12, 0, Math.PI * 2);
            ctx.fill();

            // Shoulders/Torso
            ctx.beginPath();
            ctx.moveTo(x - 15, y - 5);
            ctx.quadraticCurveTo(x, y - 10, x + 15, y - 5);
            ctx.lineTo(x + 10, y + 15);
            ctx.lineTo(x - 10, y + 15);
            ctx.fill();

            // Crossed Legs (Lotus position shape)
            ctx.beginPath();
            ctx.ellipse(x, y + 18, 22, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Floating decorative orb in center (Mind core)
            ctx.fillStyle = '#39ff14';
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Main Loop
        function loop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(loop);
        }
        
        // Start engine
        requestAnimationFrame(loop);
        draw();
    </script>
</body>
</html>
