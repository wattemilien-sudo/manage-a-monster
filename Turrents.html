<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immune Defense Sandbox</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        canvas {
            background-color: #1a1c29;
            border: 2px solid #333;
            cursor: crosshair;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            background: #232635;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            align-items: center;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
        }
        button:hover { background: #444; }
        button.active { background: #ff3366; border-color: #ff99aa; font-weight: bold; }
        .instructions {
            color: #ff3366;
            max-width: 600px;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h2>Grid Module: Immune System Tower Defense</h2>
    <div class="instructions">
        <strong>THE PARASITE THREAT:</strong> Undercooked meat has spawned Tapeworms (Green) in the digestive tract!<br>
        They are crawling down your Vein highway. Click to place <strong>White Blood Cell Turrets</strong> next to the vein to blast them.
    </div>

    <div class="controls">
        <button id="btn-turret" class="active" onclick="toggleBuildMode()">Place Macrophage Turret (Cost: 10 ATP)</button>
        <div>ATP Reserves: <strong id="atp-display" style="color:#ffcc00; font-size: 1.2em;">50</strong></div>
        <button onclick="spawnParasiteManual()" style="background: #115533;">Spawn Parasite Wave</button>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 40;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        // Grid initialization
        let grid = Array.from({ length: ROWS }, () => Array(COLS).fill({ type: 'empty' }));

        // Define a fixed Vein Highway across the grid (Row 5)
        const veinRow = 5;
        for (let c = 2; c < COLS - 2; c++) {
            grid[veinRow][c] = { type: 'vein' };
        }

        let atp = 50;
        let parasites = [];
        let projectiles = [];
        let turrets = [];

        // Auto-generate ATP over time
        setInterval(() => {
            atp += 2;
            document.getElementById('atp-display').innerText = atp;
        }, 1000);

        // Auto-spawn parasites periodically simulating bad digestion
        setInterval(() => {
            spawnParasite();
        }, 4000);

        function spawnParasite() {
            parasites.push({
                x: 2 * TILE_SIZE + TILE_SIZE/2,
                y: veinRow * TILE_SIZE + TILE_SIZE/2,
                r: 2, // grid row
                c: 2, // grid col
                hp: 3,
                maxHp: 3,
                progress: 0 // offset inside the tile for smooth movement
            });
        }

        function spawnParasiteManual() {
            spawnParasite();
        }

        // Mouse click to place turrets
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const r = Math.floor((e.clientY - rect.top) / TILE_SIZE);

            // Can only place on empty tiles adjacent to veins
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c].type === 'empty') {
                if (atp >= 10) {
                    atp -= 10;
                    document.getElementById('atp-display').innerText = atp;
                    
                    grid[r][c] = { type: 'turret' };
                    turrets.push({ r: r, c: c, range: 120, fireCooldown: 0 });
                }
            }
        });

        // --- CORE GAME LOOP (60 FPS) ---
        function update() {
            // 1. Update Parasites moving along the vein
            for (let i = parasites.length - 1; i >= 0; i--) {
                let p = parasites[i];
                p.x += 1.5; // Move right along the vein highway

                // Check if reached the end of the vein
                if (p.x > (COLS - 2) * TILE_SIZE) {
                    parasites.splice(i, 1);
                    atp = Math.max(0, atp - 15); // Parasite drains energy!
                    document.getElementById('atp-display').innerText = atp;
                    continue;
                }

                // If health drops to 0, kill it
                if (p.hp <= 0) {
                    parasites.splice(i, 1);
                    atp += 5; // Reward ATP for destroying infection
                    document.getElementById('atp-display').innerText = atp;
                }
            }

            // 2. Update Turrets (Targeting and Shooting)
            for (let turret of turrets) {
                if (turret.fireCooldown > 0) turret.fireCooldown--;

                if (turret.fireCooldown === 0) {
                    let turretX = turret.c * TILE_SIZE + TILE_SIZE/2;
                    let turretY = turret.r * TILE_SIZE + TILE_SIZE/2;

                    // Find closest parasite in range
                    let target = null;
                    let shortestDist = turret.range;

                    for (let p of parasites) {
                        let dx = p.x - turretX;
                        let dy = p.y - turretY;
                        let dist = Math.sqrt(dx*dx + dy*dy);

                        if (dist < shortestDist) {
                            shortestDist = dist;
                            target = p;
                        }
                    }

                    // If target found, fire an antibody projectile
                    if (target) {
                        projectiles.push({
                            x: turretX,
                            y: turretY,
                            target: target,
                            speed: 4
                        });
                        turret.fireCooldown = 35; // Frames between shots
                    }
                }
            }

            // 3. Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let proj = projectiles[i];
                
                // If target died mid-flight, remove projectile
                if (!parasites.includes(proj.target)) {
                    projectiles.splice(i, 1);
                    continue;
                }

                let dx = proj.target.x - proj.x;
                let dy = proj.target.y - proj.y;
                let dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < proj.speed) {
                    // Hit!
                    proj.target.hp--;
                    projectiles.splice(i, 1);
                } else {
                    // Home in on target
                    proj.x += (dx / dist) * proj.speed;
                    proj.y += (dy / dist) * proj.speed;
                }
            }
        }

        // --- RENDERING ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid & Tiles
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tile = grid[r][c];
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;

                    ctx.strokeStyle = '#222';
                    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                    if (tile.type === 'vein') {
                        ctx.fillStyle = '#611724'; // Vein highway
                        ctx.fillRect(x, y + 5, TILE_SIZE, TILE_SIZE - 10);
                    } else if (tile.type === 'turret') {
                        ctx.fillStyle = '#ffcc00'; // Immune Node / Turret
                        ctx.beginPath();
                        ctx.arc(x + TILE_SIZE/2, y + TILE_SIZE/2, 14, 0, Math.PI*2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.fillRect(x + 15, y + 15, 10, 10);
                    }
                }
            }

            // Draw Parasites (Tapeworms)
            for (let p of parasites) {
                ctx.fillStyle = '#39ff14'; // Toxic green parasite
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
                ctx.fill();

                // Health bar above parasite
                ctx.fillStyle = '#222';
                ctx.fillRect(p.x - 10, p.y - 18, 20, 4);
                ctx.fillStyle = '#ff3366';
                ctx.fillRect(p.x - 10, p.y - 18, (p.hp / p.maxHp) * 20, 4);
            }

            // Draw Projectiles (Antibodies)
            for (let proj of projectiles) {
                ctx.fillStyle = '#00f0ff';
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, 3, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // Game Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
