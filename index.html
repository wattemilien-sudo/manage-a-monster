<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomechanical Logistics: Immune Defense Module</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .header-container {
            width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #00f0ff;
        }
        .menu-btn {
            background: #1f2333;
            color: #00f0ff;
            border: 1px solid #444;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            transition: 0.2s;
            text-decoration: none;
        }
        .menu-btn:hover {
            background: #00f0ff;
            color: #000;
            border-color: #fff;
        }
        canvas {
            background-color: #1a1c29;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.2);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            background: #232635;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: 0.2s;
        }
        button:hover { background: #444; }
        .instructions {
            color: #ffcc00;
            max-width: 650px;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>Grid Module: Immune System</h2>
        <button class="menu-btn" onclick="window.location.href='index.html'">&larr; Main Menu</button>
    </div>

    <div class="instructions" id="instruction-text">
        <strong>SYSTEM IDLE:</strong> Select a protocol to engage the grid module.
    </div>

    <div class="controls" id="controls-panel">
        <button id="btn-immunisation" onclick="startImmunisation()">Immunisation Protocol</button>
        <button id="btn-defense" onclick="startDefense()">Defense Protocol (Spawn Lvl: 1)</button>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 40;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        // Game States: 'idle', 'immunisation', 'summary', 'defense'
        let gameState = 'idle';

        // Immunisation / Pac-Man Minigame Variables
        let pacman = { x: 0, y: 0, radius: 14, speed: 2.5, dx: 0, dy: 0, angle: 0 };
        let dots = [];
        let particlesEaten = 0;
        let immunisationTimer = 20; 
        let immunisationInterval = null;
        let currentLevel = 1;
        const levelTargets = { 1: 50, 2: 100, 3: 175 };
        let summaryTimer = 10; 
        let summaryInterval = null;

        // Defense Protocol Variables
        let grid = Array.from({ length: ROWS }, () => Array(COLS).fill({ type: 'empty' }));
        const veinRow = 5;
        for (let c = 1; c < COLS - 1; c++) {
            grid[veinRow][c] = { type: 'vein' };
        }
        let energy = 60;
        let baseHealth = 100;
        let defenseWave = 1;
        let parasites = [];
        let projectiles = [];
        let turrets = [];
        let defenseIntervals = [];
        let waveSpawnCount = 0;
        let spawnTimeout = null;

        // --- HEALTH REWARD HELPER ---
        function rewardHealthAndExit(amount) {
            let currentPhysical = parseInt(localStorage.getItem('health_physical')) || 100;
            let newPhysical = Math.min(100, currentPhysical + amount);
            localStorage.setItem('health_physical', newPhysical);
            window.location.href = 'index.html';
        }

        // --- IDLE SCREEN ---
        function resetToIdle() {
            gameState = 'idle';
            clearInterval(immunisationInterval);
            clearInterval(summaryInterval);
            clearDefenseIntervals();

            document.getElementById('instruction-text').innerHTML = `
                <strong>SYSTEM IDLE:</strong> Select a protocol to engage the grid module.
            `;
            document.getElementById('controls-panel').innerHTML = `
                <button id="btn-immunisation" onclick="startImmunisation()">Immunisation Protocol (Lvl ${currentLevel})</button>
                <button id="btn-defense" onclick="startDefense()">Defense Protocol (Spawn Lvl: ${currentLevel})</button>
            `;
        }

        // --- IMMUNISATION PROTOCOL ---
        function startImmunisation() {
            gameState = 'immunisation';
            if (currentLevel > 3) {
                currentLevel = 1;
                particlesEaten = 0;
            }
            if (currentLevel === 1) {
                particlesEaten = 0;
            }
            immunisationTimer = 20;

            pacman.x = TILE_SIZE * 1.5;
            pacman.y = TILE_SIZE * 1.5;
            pacman.dx = 0;
            pacman.dy = 0;
            pacman.angle = 0;

            generateImmunisationMaze();

            let needed = Math.max(0, levelTargets[currentLevel] - particlesEaten);
            document.getElementById('instruction-text').innerHTML = `
                <strong>IMMUNISATION ACTIVE (Level ${currentLevel}):</strong> Use <strong>Arrow Keys</strong> to eat particles! Time: <span id="time-display" style="color:#ffcc00;">20</span>s | Total Eaten: <span id="eaten-display" style="color:#39ff14;">${particlesEaten}</span> | Needed: <span id="needed-display" style="color:#ff3366;">${needed}</span>
            `;
            document.getElementById('controls-panel').innerHTML = `
                <div>Level: <strong style="color:#00f0ff;">${currentLevel}</strong></div>
                <button onclick="resetToIdle()" style="background: #333; margin-left: 15px;">Abort Protocol</button>
            `;

            clearInterval(immunisationInterval);
            immunisationInterval = setInterval(() => {
                immunisationTimer--;
                let timeEl = document.getElementById('time-display');
                if (timeEl) timeEl.innerText = immunisationTimer;

                if (immunisationTimer <= 0) {
                    clearInterval(immunisationInterval);
                    endImmunisation();
                }
            }, 1000);
        }

        let mazeWalls = [];
        function generateImmunisationMaze() {
            dots = [];
            mazeWalls = [];

            const wallCoords = [
                {r: 2, c: 2}, {r: 2, c: 3}, {r: 2, c: 4}, {r: 2, c: 8}, {r: 2, c: 9}, {r: 2, c: 10},
                {r: 4, c: 2}, {r: 4, c: 6}, {r: 4, c: 7}, {r: 4, c: 11},
                {r: 6, c: 4}, {r: 6, c: 5}, {r: 6, c: 9}, {r: 6, c: 10},
                {r: 7, c: 2}, {r: 7, c: 12}
            ];
            wallCoords.forEach(w => mazeWalls.push(`${w.r},${w.c}`));

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) continue;
                    if (mazeWalls.includes(`${r},${c}`)) continue;

                    dots.push({
                        x: c * TILE_SIZE + TILE_SIZE / 2,
                        y: r * TILE_SIZE + TILE_SIZE / 2,
                        eaten: false
                    });
                }
            }
        }

        function endImmunisation() {
            gameState = 'summary';
            summaryTimer = 10;

            let target = levelTargets[currentLevel];
            let passedLevel = particlesEaten >= target;

            if (passedLevel) {
                currentLevel++;
            }

            document.getElementById('instruction-text').innerHTML = `
                <strong>IMMUNISATION COMPLETE:</strong> Returning to dashboard with updated health in <span id="summary-time" style="color:#ffcc00;">3</span>s.
            `;
            document.getElementById('controls-panel').innerHTML = `
                <div>Total Eaten: <strong style="color:#39ff14;">${particlesEaten}</strong> | Target Met: <strong>${passedLevel ? 'YES' : 'NO'}</strong></div>
            `;

            // Give health bonus depending on performance and return to menu
            let healthReward = passedLevel ? 20 : 10;
            setTimeout(() => {
                rewardHealthAndExit(healthReward);
            }, 3000);
        }

        // --- DEFENSE PROTOCOL ---
        function startDefense() {
            gameState = 'defense';
            energy = 60;
            baseHealth = 100;
            defenseWave = 1;
            waveSpawnCount = 0;
            parasites = [];
            projectiles = [];
            turrets = [];
            
            grid = Array.from({ length: ROWS }, () => Array(COLS).fill({ type: 'empty' }));
            for (let c = 1; c < COLS - 1; c++) {
                grid[veinRow][c] = { type: 'vein' };
            }

            updateDefenseHUD();
            clearDefenseIntervals();

            defenseIntervals.push(setInterval(() => {
                if (gameState === 'defense') {
                    energy += 2;
                    updateDefenseHUD();
                }
            }, 1300));

            scheduleNextSpawn();
        }

        function scheduleNextSpawn() {
            if (gameState !== 'defense') return;

            spawnDefenseParasite();

            let delay = 2400;
            if (defenseWave === 2) delay = 1800;
            if (defenseWave === 3) delay = 1100;

            spawnTimeout = setTimeout(scheduleNextSpawn, delay);
        }

        function updateDefenseHUD() {
            let instEl = document.getElementById('instruction-text');
            if (instEl && gameState === 'defense') {
                instEl.innerHTML = `
                    <strong>DEFENSE PROTOCOL (Wave ${defenseWave}/3):</strong> Click empty tissue to place a Turret (Cost: 10 Energy). Click turrets to upgrade!
                `;
            }
            let controlsEl = document.getElementById('controls-panel');
            if (controlsEl && gameState === 'defense') {
                controlsEl.innerHTML = `
                    <div>Energy: <strong id="energy-display" style="color:#ffcc00;">${energy}</strong></div>
                    <div>Health: <strong id="health-display" style="color:#ff3366;">${baseHealth}</strong></div>
                    <div>Wave: <strong style="color:#00f0ff;">${defenseWave}</strong></div>
                    <button onclick="resetToIdle()" style="background: #551111;">Exit Protocol</button>
                `;
            }
        }

        function clearDefenseIntervals() {
            defenseIntervals.forEach(clearInterval);
            defenseIntervals = [];
            clearTimeout(spawnTimeout);
        }

        function spawnDefenseParasite() {
            let hp = 4;
            let speed = 1.2;
            let color = '#39ff14';

            if (defenseWave === 2) {
                hp = 10;
                speed = 1.4;
                color = '#00f0ff';
            } else if (defenseWave >= 3) {
                hp = 20;
                speed = 1.6;
                color = '#ff00ff';
            }

            parasites.push({
                x: 1 * TILE_SIZE + TILE_SIZE / 2,
                y: veinRow * TILE_SIZE + TILE_SIZE / 2,
                hp: hp,
                maxHp: hp,
                speed: speed,
                color: color
            });

            waveSpawnCount++;
            let maxSpawnsPerWave = (defenseWave === 3) ? 8 : 6;

            if (waveSpawnCount >= maxSpawnsPerWave) {
                if (defenseWave < 3) {
                    defenseWave++;
                    waveSpawnCount = 0;
                    clearTimeout(spawnTimeout);
                    updateDefenseHUD();
                    scheduleNextSpawn();
                } else {
                    clearTimeout(spawnTimeout);
                }
            }
        }

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (gameState === 'immunisation') {
                if (e.key === 'ArrowLeft') { pacman.dx = -pacman.speed; pacman.dy = 0; }
                if (e.key === 'ArrowRight') { pacman.dx = pacman.speed; pacman.dy = 0; }
                if (e.key === 'ArrowUp') { pacman.dx = 0; pacman.dy = -pacman.speed; }
                if (e.key === 'ArrowDown') { pacman.dx = 0; pacman.dy = pacman.speed; }
            }
        });

        canvas.addEventListener('click', (e) => {
            if (gameState === 'defense') {
                const rect = canvas.getBoundingClientRect();
                const c = Math.floor((e.clientX - rect.left) / TILE_SIZE);
                const r = Math.floor((e.clientY - rect.top) / TILE_SIZE);

                if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                    const tile = grid[r][c];

                    if (tile.type === 'turret') {
                        let turret = turrets.find(t => t.r === r && t.c === c);
                        if (turret && turret.level < 5) {
                            let upgradeCost = 15;
                            if (energy >= upgradeCost) {
                                energy -= upgradeCost;
                                turret.level++;
                                turret.range += 20;
                                updateDefenseHUD();
                            }
                        }
                    } else if (tile.type === 'empty') {
                        let cost = 10;
                        if (energy >= cost) {
                            energy -= cost;
                            grid[r][c] = { type: 'turret' };
                            turrets.push({
                                r: r,
                                c: c,
                                level: currentLevel,
                                range: 90 + currentLevel * 15,
                                cooldown: 0
                            });
                            updateDefenseHUD();
                        }
                    }
                }
            }
        });

        // --- UPDATE LOOP ---
        function update() {
            if (gameState === 'immunisation') {
                if (pacman.dx > 0) pacman.angle = 0;
                else if (pacman.dx < 0) pacman.angle = Math.PI;
                else if (pacman.dy > 0) pacman.angle = Math.PI / 2;
                else if (pacman.dy < 0) pacman.angle = Math.PI * 1.5;

                let nextX = pacman.x + pacman.dx;
                let nextY = pacman.y + pacman.dy;

                let c = Math.floor(nextX / TILE_SIZE);
                let r = Math.floor(nextY / TILE_SIZE);

                if (c >= 0 && c < COLS && r >= 0 && r < ROWS && !mazeWalls.includes(`${r},${c}`)) {
                    pacman.x = nextX;
                    pacman.y = nextY;
                }

                for (let dot of dots) {
                    if (!dot.eaten) {
                        let dist = Math.hypot(pacman.x - dot.x, pacman.y - dot.y);
                        if (dist < pacman.radius + 4) {
                            dot.eaten = true;
                            particlesEaten++;
                            let eatenEl = document.getElementById('eaten-display');
                            if (eatenEl) eatenEl.innerText = particlesEaten;
                            let neededEl = document.getElementById('needed-display');
                            if (neededEl) {
                                let needed = Math.max(0, levelTargets[currentLevel] - particlesEaten);
                                neededEl.innerText = needed;
                            }
                        }
                    }
                }
            } else if (gameState === 'defense') {
                for (let i = parasites.length - 1; i >= 0; i--) {
                    let p = parasites[i];
                    p.x += p.speed;

                    if (p.x > (COLS - 1) * TILE_SIZE) {
                        parasites.splice(i, 1);
                        baseHealth = Math.max(0, baseHealth - 15);
                        let healthEl = document.getElementById('health-display');
                        if (healthEl) healthEl.innerText = baseHealth;

                        if (baseHealth <= 0) {
                            alert("Defense breached! Returning to menu.");
                            resetToIdle();
                        }
                        continue;
                    }

                    if (p.hp <= 0) {
                        parasites.splice(i, 1);
                        energy += 6;
                        let energyEl = document.getElementById('energy-display');
                        if (energyEl) energyEl.innerText = energy;
                    }
                }

                // Check Victory Condition
                if (defenseWave === 3 && waveSpawnCount >= 8 && parasites.length === 0) {
                    alert("Victory! All waves cleared successfully! Physical health restored.");
                    rewardHealthAndExit(30); // Major reward for winning defense
                    return;
                }

                for (let t of turrets) {
                    if (t.cooldown > 0) t.cooldown--;

                    let tX = t.c * TILE_SIZE + TILE_SIZE / 2;
                    let tY = t.r * TILE_SIZE + TILE_SIZE / 2;

                    if (t.cooldown === 0) {
                        let target = null;
                        let minDist = t.range;

                        for (let p of parasites) {
                            let dist = Math.hypot(p.x - tX, p.y - tY);
                            if (dist < minDist) {
                                minDist = dist;
                                target = p;
                            }
                        }

                        if (target) {
                            projectiles.push({
                                x: tX,
                                y: tY,
                                target: target,
                                speed: 6,
                                damage: t.level
                            });
                            t.cooldown = Math.max(15, 45 - t.level * 6);
                        }
                    }
                }

                for (let i = projectiles.length - 1; i >= 0; i--) {
                    let proj = projectiles[i];
                    if (!parasites.includes(proj.target)) {
                        projectiles.splice(i, 1);
                        continue;
                    }

                    let dx = proj.target.x - proj.x;
                    let dy = proj.target.y - proj.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < proj.speed) {
                        proj.target.hp -= proj.damage;
                        projectiles.splice(i, 1);
                    } else {
                        proj.x += (dx / dist) * proj.speed;
                        proj.y += (dy / dist) * proj.speed;
                    }
                }
            }
        }

        // --- DRAW LOOP ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'idle') {
                ctx.fillStyle = '#ffcc00';
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SYSTEM STANDBY', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#888';
                ctx.font = '12px monospace';
                ctx.fillText('Choose Immunisation or Defense Protocol above.', canvas.width / 2, canvas.height / 2 + 15);
            } else if (gameState === 'immunisation') {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const x = c * TILE_SIZE;
                        const y = r * TILE_SIZE;
                        ctx.strokeStyle = '#222';
                        ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                        if (mazeWalls.includes(`${r},${c}`)) {
                            ctx.fillStyle = '#2d3250';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }

                for (let dot of dots) {
                    if (!dot.eaten) {
                        ctx.fillStyle = '#39ff14';
                        ctx.beginPath();
                        ctx.arc(dot.x, dot.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.save();
                ctx.translate(pacman.x, pacman.y);
                ctx.rotate(pacman.angle);
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(0, 0, pacman.radius, 0.2 * Math.PI, 1.8 * Math.PI);
                ctx.lineTo(0, 0);
                ctx.fill();
                ctx.restore();

            } else if (gameState === 'summary') {
                ctx.fillStyle = '#141622';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00f0ff';
                ctx.font = 'bold 20px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('IMMUNISATION REPORT', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px monospace';
                ctx.fillText(`Total Particles Eaten: ${particlesEaten}`, canvas.width / 2, canvas.height / 2 + 5);
                ctx.fillText(`Syncing Health & Returning...`, canvas.width / 2, canvas.height / 2 + 30);

            } else if (gameState === 'defense') {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const tile = grid[r][c];
                        const x = c * TILE_SIZE;
                        const y = r * TILE_SIZE;
                        ctx.strokeStyle = '#222';
                        ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

                        if (tile.type === 'vein') {
                            ctx.fillStyle = '#611724';
                            ctx.fillRect(x, y + 8, TILE_SIZE, TILE_SIZE - 16);
                        } else if (tile.type === 'turret') {
                            let turretObj = turrets.find(t => t.r === r && t.c === c);
                            ctx.fillStyle = turretObj && turretObj.level >= 3 ? '#00f0ff' : '#ffcc00';
                            ctx.beginPath(); 
                            ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, 12, 0, Math.PI * 2); 
                            ctx.fill();

                            if (turretObj) {
                                ctx.fillStyle = '#000';
                                ctx.font = 'bold 10px monospace';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText('L' + turretObj.level, x + TILE_SIZE / 2, y + TILE_SIZE / 2);
                            }
                        }
                    }
                }

                for (let p of parasites) {
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.fill();

                    ctx.fillStyle = '#222';
                    ctx.fillRect(p.x - 12, p.y - 18, 24, 4);
                    ctx.fillStyle = '#ff3366';
                    ctx.fillRect(p.x - 12, p.y - 18, (p.hp / p.maxHp) * 24, 4);
                }

                for (let proj of projectiles) {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(proj.x, proj.y, 3, 0, Math.PI * 2); ctx.fill();
                }
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
