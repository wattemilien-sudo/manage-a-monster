<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomechanical Logistics: Block Blaster</title>
    <style>
        body {
            background-color: #0d0e15; 
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }
        
        /* --- Return Button (Centered, Cyan outline) --- */
        .return-btn {
            background: #141622;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
            font-family: inherit;
            margin-bottom: 25px;
        }

        .return-btn:hover {
            background: #232635;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            color: #00f0ff;
        }

        canvas {
            background-color: #1a1c29;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            cursor: pointer;
        }
        
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            background: #232635;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 40px;
        }
        
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
        }
        
        button:hover { background: #444; border-color: #00f0ff; color: #00f0ff; }
        
        .instructions {
            color: #00f0ff;
            max-width: 650px;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Dashboard Return Button -->
    <a href="index.html" class="return-btn">Return to Dashboard</a>

    <h2>Grid Module: Mental Health Block Blaster</h2>
    
    <div class="instructions" id="instruction-text">
        <strong>SYSTEM IDLE:</strong> Smash negative stress blocks to purify cognitive patterns.
    </div>

    <div class="controls" id="controls-panel">
        <button id="btn-start" onclick="startGame()">Initialize Blaster Protocol</button>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game States: 'idle', 'playing', 'win', 'lose'
        let gameState = 'idle'; 

        let paddle = {
            x: 250,
            y: 360,
            width: 100,
            height: 12,
            dx: 0,
            speed: 7
        };

        let ball = {
            x: 300,
            y: 345,
            radius: 7,
            speed: 4,
            dx: 3,
            dy: -3
        };

        let bricks = [];
        const brickRowCount = 4;
        const brickColumnCount = 7;
        const brickWidth = 72;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 40;
        const brickOffsetLeft = 31;

        const words = ["STRESS", "ANXIETY", "BURNOUT", "DOUBT", "FEAR", "PANIC", "TENSION"];

        let rightPressed = false;
        let leftPressed = false;

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    let randomWord = words[Math.floor(Math.random() * words.length)];
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1, 
                        text: randomWord 
                    };
                }
            }
        }

        function resetToIdle() {
            gameState = 'idle';
            document.getElementById('instruction-text').innerHTML = `
                <strong>SYSTEM IDLE:</strong> Smash negative stress blocks to purify cognitive patterns.
            `;
            document.getElementById('controls-panel').innerHTML = `
                <button id="btn-start" onclick="startGame()">Initialize Blaster Protocol</button>
            `;
        }

        function startGame() {
            gameState = 'playing';
            paddle.x = 250;
            ball.x = 300;
            ball.y = 345;
            ball.dx = 3 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
            initBricks();
            updateUI();
        }

        function updateUI() {
            if (gameState === 'playing') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong>PROTOCOL ACTIVE:</strong> Use <strong>Arrow Keys</strong> or <strong>A / D</strong> to control paddle. Clear all stress blocks!
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div>Status: <strong style="color:#00f0ff;">Purifying Cognitive Matrix</strong></div>
                    <button onclick="resetToIdle()" style="background: #551111;">Abort Protocol</button>
                `;
            } else if (gameState === 'win') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong style="color:#39ff14;">PROTOCOL SUCCESSFUL:</strong> Stress blocks eradicated. Mental health upgraded. Press <strong>SPACEBAR</strong> to replay.
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div style="color:#39ff14; font-weight:bold;">+25 MENTAL HEALTH RESTORED</div>
                `;
            } else if (gameState === 'lose') {
                document.getElementById('instruction-text').innerHTML = `
                    <strong style="color:#ff3366;">PROTOCOL FAILED:</strong> Core breach detected. Press <strong>SPACEBAR</strong> to retry.
                `;
                document.getElementById('controls-panel').innerHTML = `
                    <div style="color:#ff3366; font-weight:bold;">SYSTEM STRESS UNCHALLENGED</div>
                `;
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') rightPressed = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftPressed = true;
            if (e.code === 'Space') {
                if (gameState === 'win' || gameState === 'lose') {
                    e.preventDefault();
                    startGame();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') rightPressed = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftPressed = false;
        });

        // Mouse/Touch movement support
        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== 'playing') return;
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            paddle.x = mouseX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        });

        function collisionDetection() {
            let activeBricksCount = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricksCount++;
                        let brickX = brickOffsetLeft + c * (brickWidth + brickPadding);
                        let brickY = brickOffsetTop + r * (brickHeight + brickPadding);
                        b.x = brickX;
                        b.y = brickY;

                        if (
                            ball.x > brickX &&
                            ball.x < brickX + brickWidth &&
                            ball.y > brickY &&
                            ball.y < brickY + brickHeight
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            activeBricksCount--;

                            // Check Win Condition
                            if (activeBricksCount === 0) {
                                gameState = 'win';
                                let currentMental = parseInt(localStorage.getItem('health_mental')) || 50;
                                localStorage.setItem('health_mental', Math.min(100, currentMental + 25));
                                updateUI();
                            }
                        }
                    }
                }
            }
        }

        function update() {
            if (gameState !== 'playing') return;

            // Paddle movement
            if (rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            } else if (leftPressed && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }

            // Ball movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collisions
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            } 
            // Paddle collision
            else if (
                ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width
            ) {
                // Add angle deflection based on where it hits the paddle
                let hitPoint = ball.x - (paddle.x + paddle.width / 2);
                ball.dx = hitPoint * 0.15;
                ball.dy = -Math.abs(ball.dy);
            } 
            // Bottom collision (Lose)
            else if (ball.y + ball.radius > canvas.height) {
                gameState = 'lose';
                updateUI();
            }

            collisionDetection();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background Grid Lines
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for(let i = 0; i < canvas.width; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let i = 0; i < canvas.height; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            if (gameState === 'idle') {
                ctx.fillStyle = '#00f0ff';
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('BLOCK BUSTER MODULE - STANDBY', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#888';
                ctx.font = '12px monospace';
                ctx.fillText('Click initialize to begin protocol.', canvas.width / 2, canvas.height / 2 + 20);
            } else {
                // Draw Bricks
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        if (bricks[c][r].status === 1) {
                            let brickX = brickOffsetLeft + c * (brickWidth + brickPadding);
                            let brickY = brickOffsetTop + r * (brickHeight + brickPadding);
                            
                            ctx.fillStyle = '#232635';
                            ctx.strokeStyle = '#ff3366';
                            ctx.lineWidth = 1.5;
                            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
                            ctx.strokeRect(brickX, brickY, brickWidth, brickHeight);

                            ctx.fillStyle = '#ff3366';
                            ctx.font = 'bold 9px monospace';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(bricks[c][r].text, brickX + brickWidth / 2, brickY + brickHeight / 2);
                        }
                    }
                }

                // Draw Paddle
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

                // Draw Ball
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#39ff14';
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0; // Reset shadow
            }

            // Win / Lose Overlays
            if (gameState === 'win') {
                ctx.fillStyle = 'rgba(20, 22, 34, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#39ff14';
                ctx.font = 'bold 22px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('STRESS BLOCKS DESTROYED', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '13px monospace';
                ctx.fillText('Mental health upgraded successfully.', canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#00f0ff';
                ctx.fillText('Press SPACEBAR to play again.', canvas.width / 2, canvas.height / 2 + 40);
            } else if (gameState === 'lose') {
                ctx.fillStyle = 'rgba(20, 22, 34, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ff3366';
                ctx.font = 'bold 22px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('CORE OVERWHELMED', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '13px monospace';
                ctx.fillText('Negative stress blocks remain active.', canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('Press SPACEBAR to retry protocol.', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
