<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Swarm Sandbox</title>
    <style>
        body {
            background-color: #0d0e15;
            color: #e0e6ed;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        canvas {
            background-color: #1a1c29;
            border: 2px solid #333;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            background: #232635;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #444; }
        .instructions {
            color: #00f0ff;
            max-width: 600px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h2>Grid Module: Autonomous Enzyme Swarm</h2>
    <div class="instructions">
        <strong>EARLY GAME LOGISTICS:</strong> Before veins are built, these worker-golems carry resources directly.<br>
        Watch them automatically detect loose Oxygen, fetch it, and deliver it to the Heart.
    </div>

    <div class="controls">
        <button onclick="spawnResource()">Force Spawn Oxygen</button>
        <button onclick="spawnWorker()" style="background: #e0e6ed; color: #000; font-weight: bold;">+ Buy Worker (Cost: 5)</button>
        <div style="margin-left: 20px; font-size: 1.2em; padding-top: 8px;">
            ATP Stored: <strong id="score" style="color:#ffcc00;">0</strong>
        </div>
    </div>

    <br>
    <canvas id="gameCanvas" width="600" height="300"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Entities
        const lungs = { x: 50, y: 150, radius: 40, color: '#00f0ff', name: 'LUNGS' };
        const heart = { x: 500, y: 150, radius: 50, color: '#ffcc00', name: 'HEART' };
        
        let resources = [];
        let workers = [];
        let score = 0;

        // Worker Settings
        const WORKER_SPEED = 2;
        const PICKUP_RADIUS = 10;

        // Spawn initial workers
        for(let i=0; i<3; i++) spawnWorker();

        function spawnWorker() {
            workers.push({
                x: heart.x + (Math.random() - 0.5) * 50,
                y: heart.y + (Math.random() - 0.5) * 50,
                state: 'IDLE', // IDLE, FETCHING, DELIVERING
                targetRes: null,
                carriedItem: null
            });
        }

        function spawnResource() {
            // Oxygen spawns randomly around the Lungs
            resources.push({
                x: lungs.x + (Math.random() - 0.5) * 40,
                y: lungs.y + (Math.random() - 0.5) * 40,
                claimed: false,
                id: Math.random() // Unique ID to track which resource is which
            });
        }

        // Auto-spawn resources every 2 seconds
        setInterval(spawnResource, 2000);

        // --- CORE AI LOOP (Runs at 60 FPS) ---
        function update() {
            for (let worker of workers) {
                
                // STATE 1: Looking for work
                if (worker.state === 'IDLE') {
                    // Find an unclaimed resource
                    let target = resources.find(r => !r.claimed);
                    if (target) {
                        target.claimed = true;
                        worker.targetRes = target;
                        worker.state = 'FETCHING';
                    }
                }
                
                // STATE 2: Moving to grab the resource
                else if (worker.state === 'FETCHING') {
                    // If the resource vanished (e.g. eaten by a parasite), go back to idle
                    if (!resources.includes(worker.targetRes)) {
                        worker.state = 'IDLE';
                        continue;
                    }

                    // Move towards resource
                    let dx = worker.targetRes.x - worker.x;
                    let dy = worker.targetRes.y - worker.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < PICKUP_RADIUS) {
                        // Pick it up
                        worker.carriedItem = worker.targetRes;
                        // Remove it from the ground
                        resources = resources.filter(r => r.id !== worker.targetRes.id);
                        worker.targetRes = null;
                        worker.state = 'DELIVERING';
                    } else {
                        // Fly towards it
                        worker.x += (dx / dist) * WORKER_SPEED;
                        worker.y += (dy / dist) * WORKER_SPEED;
                    }
                }
                
                // STATE 3: Bringing it to the Heart
                else if (worker.state === 'DELIVERING') {
                    let dx = heart.x - worker.x;
                    let dy = heart.y - worker.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < heart.radius) {
                        // Drop it off
                        worker.carriedItem = null;
                        worker.state = 'IDLE';
                        score++;
                        document.getElementById('score').innerText = score;
                    } else {
                        // Fly towards heart
                        worker.x += (dx / dist) * WORKER_SPEED;
                        worker.y += (dy / dist) * WORKER_SPEED;
                    }
                }
            }
        }

        // --- RENDERING PHASE ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Organs
            ctx.fillStyle = lungs.color;
            ctx.beginPath(); ctx.arc(lungs.x, lungs.y, lungs.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillText(lungs.name, lungs.x - 15, lungs.y + 5);

            ctx.fillStyle = heart.color;
            ctx.beginPath(); ctx.arc(heart.x, heart.y, heart.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillText(heart.name, heart.x - 15, heart.y + 5);

            // Draw loose resources on the ground
            for (let res of resources) {
                ctx.fillStyle = '#00f0ff';
                ctx.beginPath(); ctx.arc(res.x, res.y, 4, 0, Math.PI*2); ctx.fill();
            }

            // Draw Workers
            for (let worker of workers) {
                // The worker body
                ctx.fillStyle = '#e0e6ed';
                ctx.beginPath(); ctx.arc(worker.x, worker.y, 5, 0, Math.PI*2); ctx.fill();

                // If carrying something, draw the glowing resource on top of them
                if (worker.state === 'DELIVERING') {
                    ctx.fillStyle = '#00f0ff'; // Oxygen color
                    ctx.beginPath(); ctx.arc(worker.x, worker.y, 3, 0, Math.PI*2); ctx.fill();
                    
                    // Draw a faint delivery line to the heart
                    ctx.strokeStyle = 'rgba(255, 204, 0, 0.2)';
                    ctx.beginPath(); ctx.moveTo(worker.x, worker.y); ctx.lineTo(heart.x, heart.y); ctx.stroke();
                } else if (worker.state === 'FETCHING' && worker.targetRes) {
                    // Draw a faint line to their target so the player knows what they are doing
                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
                    ctx.beginPath(); ctx.moveTo(worker.x, worker.y); ctx.lineTo(worker.targetRes.x, worker.targetRes.y); ctx.stroke();
                }
            }
        }

        // Main Game Loop (60fps)
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
